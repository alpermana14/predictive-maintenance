server {
    listen 80;
    listen [::]:80;
    
    gzip on;
    # Digital twin model (twin.json) and point cloud (cloud.bin) compress well
    gzip_types application/json application/octet-stream text/css application/javascript;
    # Requests arrive through the CapRover proxy (Via header, HTTP/1.0), which nginx does not compress by default
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_vary on;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # to redirect all the requests to index.html,
        # useful when you are using react-router
        try_files $uri /index.html;
    }
}
